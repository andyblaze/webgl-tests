<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageGd - Canvas test</title>
  <link href="css/site.css" rel="stylesheet" type="text/css">
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "./js/three/three.module.js"
    }
}
</script>
  <h1>ImageGd canvas test</h1>

  <div class="controls">
    <label>
      Load a PNG
      <input id="fileInput" type="file" accept="image/png,.png" autocomplete="off">
    </label>

    <label>
      Pick a tiling method
      <select id="tileType" name="method" autocomplete="off">
        <option value="mirror">Mirror</option>
        <option value="matchEdges">Match Edges</option>
        <option value="offsetAndBlend">Offset and Blend</option>
      </select>
    </label>

    <label>
      PHP endpoint URL
      <input id="endpoint" type="url" value="img-processor.php" placeholder="https://example.com/process.php" autocomplete="off">
    </label>

    <button id="sendButton" type="button" disabled>Send to PHP</button>
  </div>

  <main class="canvases">
    <section class="panel">
      <h2>1. Source image</h2>
      <div class="canvas-wrap">
        <canvas id="sourceCanvas" width="256" height="256"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>2. Processed image</h2>
      <div class="canvas-wrap">
        <canvas id="resultCanvas" width="256" height="256"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>3. Three preview</h2>
      <div class="canvas-wrap" id="three-wrap">
        
      </div>
    </section>
  </main>

  <p id="status" role="status" aria-live="polite">Choose a PNG to get started.</p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
