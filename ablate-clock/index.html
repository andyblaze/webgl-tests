<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Hand</title>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>

<script type="module">
import * as THREE from "three";
const scene = new THREE.Scene();
const aspect = window.innerWidth / window.innerHeight;

const camera = new THREE.PerspectiveCamera( 65, aspect, 0.1, 100 );
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

class Config {
    constructor() {
        this.hands = {
            secondHand: {
                segments: 40, length: 5,
                width: 0.06, angle: 0,
                speed: 0.6, direction: -1
            }
        }
    }
}
const config = new Config();

class Hand {
    constructor(three, name, cfg) {
        this.name = name;
        const data = cfg.hands[name];
        // Hand geometry & setup
        this.segments = data.segments;
        this.length = data.length;
        this.width = data.width;
        this.angle = data.angle;
        this.speed = data.speed;
        this.direction = data.direction;

        this.positions = new Float32Array((this.segments + 1) * 2 * 3);
        this.indices = [];

        for ( let i = 0; i < this.segments; i++ ) {
            const a = i * 2;
            const b = a + 2;

            this.indices.push(
                a, a + 1, b,
                a + 1, b + 1, b
            );
        }

        this.geometry = new three.BufferGeometry();
        this.geometry.setAttribute(
            "position",
            new three.BufferAttribute(this.positions, 3)
        );
        this.geometry.setIndex(this.indices);

        this.material = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            side: three.DoubleSide
        });

        this.native = new three.Mesh(this.geometry, this.material);
    }
    updateGeometry(index, x, y) {
        const pos = this.geometry.attributes.position.array;
        const halfWidth = this.width / 2; 

        pos[index + 0] = x;
        pos[index + 1] = y - halfWidth;
        pos[index + 2] = 0;

        pos[index + 3] = x;
        pos[index + 4] = y + halfWidth;
        pos[index + 5] = 0;   
    }
update(dt) {
    this.angle += dt * this.speed * this.direction;
    this.native.rotation.z = this.angle;

    const flexibleStart = 0.5;
    const maxBend = 0.8; // radians; ~46 degrees at the tip

    let x = 0;
    let y = 0;

    for (let i = 0; i <= this.segments; i++) {
        const t = i / this.segments;

        // Work out the bend of this segment.
        let bend = 0;

        if (t > flexibleStart) {
            const flexT =
                (t - flexibleStart) / (1 - flexibleStart);

            // Smoothly increase bend towards the tip.
            bend = Math.sin(flexT * Math.PI / 2) * maxBend;
        }

        // Position the segment.
        if (i > 0) {
            const segmentLength = this.length / this.segments;

            x += Math.cos(bend) * segmentLength;
            y += Math.sin(bend) * segmentLength;
        }

        const index = i * 2 * 3;

        this.updateGeometry(index, x, y);
    }

    this.geometry.attributes.position.needsUpdate = true;
}
    update0(dt) {
        this.angle += dt * this.speed * this.direction;
        this.native.rotation.z = this.angle;
        
        for ( let i = 0; i <= this.segments; i++ ) {
            const t = i / this.segments;

            // Curve increases dramatically with distance from pivot.
            const curve = 1.2 * t * t;

            const x = t * this.length;
            const y = curve;          

            const index = i * 2 * 3;

            this.updateGeometry(index, x, y);
        }

        this.geometry.attributes.position.needsUpdate = true;
    }
}
const hand = new Hand(THREE, "secondHand", config);
scene.add(hand.native);


// Animation
const timer = new THREE.Clock();

function animate(now) {
    const dt = timer.getDelta();
    const elapsed = timer.getElapsedTime(); // might need later
    hand.update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

window.addEventListener("resize", () => {
    const aspect = window.innerWidth / window.innerHeight;

    camera.left = -10 * aspect;
    camera.right = 10 * aspect;
    camera.top = 7.5;
    camera.bottom = -7.5;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
