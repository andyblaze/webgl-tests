<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Three.js Workbench</title>
{{css}}
</head>
<body>
<label>
    <span id="testlbl"></span>
    <input type="range" min="0", max="2" step="1" id="testo" data-lbl="testlbl" data-assoc="geometry" />
</label>
<script>
class Associations {
    constructor() {
        this.geometry = [
            {
                label: "Sphere"
            },
            {
                label: "Box"
            },
            {
                label: "Torus Knot"
            }
        ];
    }
    get(group, index) {
        return this[group][index];
    }
}
const associations = new Associations();

function syncho(ctrl) {
    const item = associations.get(ctrl.dataset.assoc, Number(ctrl.value));
    document.getElementById(ctrl.dataset.lbl).textContent = item.label;
}
const ctrl = document.getElementById("testo");
ctrl.oninput = () => syncho(ctrl);
syncho(ctrl);

</script>
<form id="ui-panel" autocomplete="off">
<div id="accordion">
     <div class="section">
        <h4>Lighting</h4>
        <div class="controls">
            {{lights}}
        </div>
    </div>
    <div class="section">
        <h4>Material</h4>
        <div class="controls">
            {{material}}
        </div>
    </div>   
</div> 
</form>
<div id="workspace"></div>
<script>
    {{lightsCfg}}
</script>
<script>
const version = Date.now();

const script = document.createElement("script");
script.type = "module";
script.src = `js/main.js?v=${version}`;

document.body.appendChild(script);
</script>
</body>
</html>
