<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Three.js Workbench</title>
{{css}}
</head>
<body>
<!--<label>
    <span id="geometry-lbl"></span>
    <input type="range" min="0" step="1" value="0" id="geometry" class="associative" data-lbl="geometry-lbl" data-assoc="geometry" autocomplete="off" />
</label>
<label>
    <span id="material-lbl"></span>
    <input type="range" min="0" step="1" value="0" id="material" class="associative" data-lbl="material-lbl" data-assoc="material" autocomplete="off" />
</label>-->

<form id="ui-panel" autocomplete="off">
<div>
<label>
    <span id="normalMap-lbl"></span>
    <input type="range" min="0" step="1" value="0" id="maps" class="associative" data-lbl="normalMap-lbl" data-img="normalMap-img" data-assoc="normalMaps" data-property="normalMap" data-type="map" data-index="maps" data-mapPath="" autocomplete="off" />
<img id="normalMap-img" class="assoc-img" src="" /></label>
</div>
<div id="accordion">
     <div class="section">
        <h4>Lighting</h4>
        <div class="controls">
            {{lights}}
        </div>
    </div>
    <div class="section">
        <h4>Material</h4>
        <div class="controls">
            {{material}}
        </div>
    </div>   
    <div class="section">
        <h4>Maps</h4>
        <div class="controls">
            {{maps}}
        </div>
    </div>   
</div> 
</form>
<div id="workspace"></div>
<script>
    {{lightsCfg}}
</script>
<script>
const version = Date.now();

const script = document.createElement("script");
script.type = "module";
script.src = `js/main.js?v=${version}`;

document.body.appendChild(script);
</script>
</body>
</html>
