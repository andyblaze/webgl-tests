<!DOCTYPE html>
<html>
<head>
<title>Map maker</title>
<link href="css/site.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div id="ui">
    <form id="ui-ctrls">
        <label>Height: <span id="height-lbl">0</span>
            <input type="range" min="0" max="1" step="0.01" value="0" id="height" data-label="height-lbl" data-type="float" />
        </label>
        <label>Perlin: <span id="perlin-lbl">0</span>
            <input type="range" min="0" max="1" step="0.01" value="0" id="perlin" data-label="perlin-lbl" data-type="perlin" />
        </label>
        <label>Scale: <span id="scale-lbl">0</span>
            <input type="range" min="0" max="1" step="0.01" value="0" id="scale" data-label="scale-lbl" data-type="float" />
        </label>
    </form>
</div>
<div id="maps">
    <canvas id="cnvsMap" width="512" height="512"></canvas>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
