<!DOCTYPE html>
<html>
<head>
<title>Map maker</title>
<link href="css/site.css" rel="stylesheet" type="text/css" />
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "./js/three/three.module.js",
        "three/addons/": "./js/examples/jsm/"
    }
}
</script>
<div id="ui">
    <form id="ui-ctrls">
        <div>{{ctrls}}</div>
        <div>{{post}}</div>
    </form>
</div>
<div id="maps">
    <div>
        <canvas id="heightMap" width="512" height="512"></canvas>
    </div>
    <div>
        <button id="apply-normal">Apply</button><br />
        <canvas id="normalMap" width="512" height="512"></canvas>
    </div>
    <div id="three">
        <button id="apply-three">Apply</button>
        {{select}}        
        <br />
    </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
