
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js - Simple Terrain</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #18212b;
    }

    canvas {
        display: block;
    }

    #info {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="info">
    <strong>Simple Terrain</strong><br>
    Drag to rotate · Scroll to zoom
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


// SCENE

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18212b);


// CAMERA

const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(30, 25, 35);


// RENDERER

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// CONTROLS

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;


// LIGHTING

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const sunlight = new THREE.DirectionalLight(0xffffff, 2.0);
sunlight.position.set(15, 30, 10);
sunlight.castShadow = true;
scene.add(sunlight);

class Materials {
    constructor(three) {
        this.three = three;
        this.loader = new three.TextureLoader();
        this.data = {
            "green": {
                color: 0x49850e, transmission: 0.2,
                roughness: 1, metalness: 0,
                emissive: 0x008040, emissiveIntensity: 0.12,
                sheenColor: 0x008080, sheen: 0.18,
                side: three.DoubleSide,
                normalScale: new three.Vector2(2, 2),
                normalMap: this.getMap("marble-normal.png", 4)
            }
        };
    }
    getMap(map, repeat=0) {
        const texmap = this.loader.load(map);
        if ( repeat > 1 ) {
            texmap.wrapS = this.three.RepeatWrapping;
            texmap.wrapT = this.three.RepeatWrapping;
            texmap.repeat.set(repeat, repeat);
        }
        return texmap;
    }
    getMat(key) {
        return this.data[key];
    }
}

const materials = new Materials(THREE);


// TERRAIN PLANE

class Terrain {
    constructor(three, sz, segs) {
        this.three = three;
        this.material = new three.MeshPhysicalMaterial({color: 0xffffff});
        this.geometry = new three.PlaneGeometry(sz, sz, segs, segs);
        // Rotate plane to lie horizontally
        this.geometry.rotateX(-Math.PI / 2);    
    }
    setShadows(recv, cast) {
        this.terrain.receiveShadow = recv;
        this.terrain.castShadow = cast; 
        return this;
    }
    setMaterial(m) {
        this.material.dispose();
        this.material = new this.three.MeshPhysicalMaterial(m);
        this.terrain = new this.three.Mesh(this.geometry, this.material);
        return this;
    }
    get native() {
        return this.terrain;
    }
    terraform(func) {        
        const positions = this.geometry.attributes.position;
        func(positions);
        positions.needsUpdate = true;
        this.geometry.computeVertexNormals(); 
        return this;
    }
    addTo(scene) {
        scene.add(this.terrain);
    }
}


class Perlin {

    constructor(seed = 12345) {

        // Seeded random number generator
        const random = () => {
            seed |= 0;
            seed = seed + 0x6D2B79F5 | 0;

            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };

        // Create and shuffle permutation table
        const p = Array.from({ length: 256 }, (_, i) => i);

        for (let i = 255; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [p[i], p[j]] = [p[j], p[i]];
        }

        // Duplicate table to avoid overflow
        this.permutation = [...p, ...p];

        this.gradients = [
            [1, 0], [-1, 0],
            [0, 1], [0, -1],
            [Math.SQRT1_2, Math.SQRT1_2],
            [-Math.SQRT1_2, Math.SQRT1_2],
            [Math.SQRT1_2, -Math.SQRT1_2],
            [-Math.SQRT1_2, -Math.SQRT1_2]
        ];
    }

    fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
    }

    lerp(a, b, t) {
        return a + t * (b - a);
    }

    grad(hash, x, y) {
        const g = this.gradients[hash & 7];
        return g[0] * x + g[1] * y;
    }

    noise(x, y) {

        const p = this.permutation;

        const floorX = Math.floor(x);
        const floorY = Math.floor(y);

        const xi = floorX & 255;
        const yi = floorY & 255;

        const xf = x - floorX;
        const yf = y - floorY;

        const u = this.fade(xf);
        const v = this.fade(yf);

        const aa = p[p[xi] + yi];
        const ab = p[p[xi] + yi + 1];
        const ba = p[p[xi + 1] + yi];
        const bb = p[p[xi + 1] + yi + 1];

        const n1 = this.lerp(
            this.grad(aa, xf, yf),
            this.grad(ba, xf - 1, yf),
            u
        );

        const n2 = this.lerp(
            this.grad(ab, xf, yf - 1),
            this.grad(bb, xf - 1, yf - 1),
            u
        );

        return this.lerp(n1, n2, v);
    }
}


class Deformer {
    constructor(p) {
        this.perlin = p;
    }
    singleMountain(positions) {
        for (let i = 0; i < positions.count; i++) {

            const x = positions.getX(i);
            const z = positions.getZ(i);

            // Distort the mountain's radius by direction
            const angle = Math.atan2(z, x);

            const radius =
                13 +
                Math.sin(angle * 2) * 3 +
                Math.cos(angle * 3) * 2 +
                Math.sin(angle * 5) * 1.5;

            // Slightly irregular peak position
            const dx = x - 1.5;
            const dz = z + 1.0;

            const distance = Math.sqrt(dx * dx + dz * dz);

            const falloff = Math.max(0, 1 - distance / radius);

            // Add some unevenness to the slopes
            const variation =
                Math.sin(x * 0.3 + z * 0.2) * 0.8 +
                Math.cos(z * 0.4 - x * 0.15) * 0.6;

            const height = Math.max(
                0,
                Math.pow(falloff, 2) * 12 +
                variation// * falloff
            );

            positions.setY(i, height);
        }
    }
    sineWave(positions) {
        for ( let i = 0; i < positions.count; i++ ) {

            const x = positions.getX(i);
            const z = positions.getZ(i);

            // Distance from centre
            const distance = Math.sqrt(x*x + z*z);

            // Radial falloff
            const radius = 18;
            const falloff = Math.max(0, 2 - distance / radius);

            // Original terrain waves
            let height = 0;

            height += Math.sin(x * 0.25) * 1.5;
            height += Math.cos(z * 0.3) * 1.5;
            height += Math.sin((x + z) * 0.18) * 2.0;

            // Apply falloff
            height *= falloff;

            positions.setY(i, height);
        }
    }
    noise = (positions) => {
        const scale = 0.16;
        const amplitude = 3;

        for (let i = 0; i < positions.count; i++) {

            const x = positions.getX(i);
            const z = positions.getZ(i);

            const height = this.perlin.noise(x * scale, z * scale);

            positions.setY(i, positions.getY(i) + height * amplitude);
        }
    };
}

const deform = new Deformer(new Perlin());

const land = new Terrain(THREE, 40, 256);
land.setMaterial(materials.getMat("green"))
    .terraform(deform.sineWave)
    .terraform(deform.singleMountain)
    .terraform(deform.noise)
    .addTo(scene);

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();


// WINDOW RESIZE
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

});

</script>

</body>
</html>
