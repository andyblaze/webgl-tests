
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js - Simple Terrain</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #18212b;
    }

    canvas {
        display: block;
    }

    #info {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="info">
    <strong>Simple Terrain</strong><br>
    Drag to rotate · Scroll to zoom
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


// SCENE

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18212b);


// CAMERA

const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(30, 25, 35);


// RENDERER

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// CONTROLS

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;


// LIGHTING

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const sunlight = new THREE.DirectionalLight(0xffffff, 2.0);
sunlight.position.set(15, 30, 10);
sunlight.castShadow = true;
scene.add(sunlight);


// TERRAIN PLANE

class Land {
    constructor(three) {

        const segments = 256;
        const size = 60;

        const geometry = new three.PlaneGeometry(
            size,
            size,
            segments,
            segments
        );

        // Rotate plane to lie horizontally
        geometry.rotateX(-Math.PI / 2);

        const positions = geometry.attributes.position;
        this.createTerrain(positions);

        positions.needsUpdate = true;
        geometry.computeVertexNormals();       
        
        const loader = new three.TextureLoader();
        const texmap = loader.load("marble-normal.png");
        texmap.wrapS = three.RepeatWrapping;
        texmap.wrapT = three.RepeatWrapping;

        texmap.repeat.set(8, 8);

        const material = new three.MeshPhysicalMaterial({
            color: 0x49850e, transmission: 0.2,
            roughness: 1, metalness: 0,
            emissive: 0x008040, emissiveIntensity: 0.12,
            sheenColor: 0x008080, sheen: 0.18,
            side: THREE.DoubleSide,
            normalScale: new THREE.Vector2(2, 2),
            normalMap: texmap
        });

        this.terrain = new three.Mesh(geometry, material);

        this.terrain.receiveShadow = true;
        this.terrain.castShadow = true;        
    }
    createTerrain(positions) {
        for ( let i = 0; i < positions.count; i++ ) {

            const x = positions.getX(i);
            const z = positions.getZ(i);

            // Distance from centre
            const distance = Math.sqrt(x*x + z*z);

            // Radial falloff
            const radius = 18;
            const falloff = Math.max(0, 2 - distance / radius);

            // Original terrain waves
            let height = 0;

            height += Math.sin(x * 0.25) * 1.5;
            height += Math.cos(z * 0.3) * 1.5;
            height += Math.sin((x + z) * 0.18) * 2.0;

            // Apply falloff
            height *= falloff;

            positions.setY(i, height);
        }
    }
}

const land = new Land(THREE);

scene.add(land.terrain);


// OPTIONAL GRID HELPER

/*const grid = new THREE.GridHelper(40, 40, 0x506070, 0x344452);
grid.position.y = -0.15;
scene.add(grid);*/


// ANIMATION LOOP

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);
}

animate();


// WINDOW RESIZE

window.addEventListener('resize', () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
